<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>CloudStore</title>
</head>
<body>

<header class="navbar">
    <h1>CloudStore</h1>

    <nav>
        <button onclick="showView('register')">Registrera</button>
        <button onclick="showView('login')">Logga in</button>
        <button onclick="showView('ordersSection')">Mina beställningar</button>
        <button onclick="logoutUser()" class="logout">Logga ut</button>
    </nav>
</header>

<!-- 👤 VISAR INLOGGAD USER -->
<div style="text-align:center; margin-top:10px;">
    <p id="currentUser">Inte inloggad</p>
</div>

<main>

    <!-- 📝 REGISTER -->

        <section id="register" class="view hidden">
        <h2>Registrera konto</h2>

        <input id="registerName" placeholder="Användarnamn">
        <input id="registerPassword" placeholder="Lösenord" type="password">

        <button onclick="registerUser()">Registrera</button>
    </section>

    <!-- 🔐 LOGIN -->
        <section id="login" class="view hidden">
        <h2>Logga in</h2>

        <input id="loginUsername" placeholder="Användarnamn">
        <input id="loginPassword" placeholder="Lösenord" type="password">

        <button onclick="loginUser()">Logga in</button>
    </section>

        <!-- 📦 ORDERS -->
        <section id="ordersSection" class="view hidden">
            <h2>Mina beställningar</h2>

            <div id="orders"></div>
        </section>

    <!-- 🛒 PRODUCTS -->
        <section id="productsSection">
            <h2>Produkter</h2>

            <div id="products"></div>
            <!-- 🧾 ORDER BUTTON (valfritt om du använder cart senare) -->
            <section>
                <button onclick="placeOrder()">Spara order</button>
            </section>
    </section>


</main>

<script src="app.js"></script>
</body>
</html>
