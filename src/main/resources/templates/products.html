<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background: #1f2937;
            color: white;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .title {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
            color: #111827;
        }

        .price {
            color: #16a34a;
            font-weight: bold;
        }

        .btn {
            margin-top: 10px;
            display: inline-block;
            padding: 8px 12px;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<h1>🛍 Products</h1>

<div class="container">
    <div class="card" th:each="product : ${products}">

        <img th:src="${product.image}" />

        <div class="title" th:text="${product.title}"></div>

        <div class="price">
            $ <span th:text="${product.price}"></span>
        </div>

        <a href="#" class="btn">View details</a>

    </div>
</div>

</body>
</html>
