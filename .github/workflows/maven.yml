name: Run Tests

on:
  push:
    branches: [ "Tester"  ]
  pull_request:
    branches: [ "Tester" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Execute Spring Boot Tests
      run: mvn clean test
